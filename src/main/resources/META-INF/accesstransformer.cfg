# Widens two fields so FlatWorldTuning can replace the flat_world dimension's level data.
#
# Level.levelData        : protected final WritableLevelData -> both flags removed
# ServerLevel.levelData  : inherited from Level (same field)
# ServerLevel.serverLevelData : private final ServerLevelData -> both flags removed
#
# Both must be replaced together with the same object: ServerLevel#tickTime() reads
# this.levelData, while ServerLevel#advanceWeatherCycle() reads this.levelData and
# writes this.serverLevelData. If they pointed to different instances the time/weather
# logic would read a value it never wrote.
public-f net.minecraft.world.level.Level levelData
public-f net.minecraft.server.level.ServerLevel serverLevelData
